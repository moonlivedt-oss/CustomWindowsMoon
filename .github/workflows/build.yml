# Сборка RadialMenu, RadialTools и RadialShutUp тем же MSYS2 ucrt64 (cmake + ninja + g++), что и build.cmd, и тесты без
# окон (radial_tests). Эталонные снимки студии (build.cmd snaps) здесь не идут: им нужны шрифты и экран этого ПК.
# Чужие действия закреплены по коммиту: новый выпуск или перенесённый тег не подменят сборку.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRADIAL_OUT_DIR="$PWD/out"

      - name: Build
        run: cmake --build build

      - name: Tests
        run: |
          cmake --build build --target radial_tests
          ./build/radial_tests.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: radial-exe
          path: |
            out/RadialMenu.exe
            out/RadialTools.exe
            out/RadialShutUp.exe
          if-no-files-found: warn
