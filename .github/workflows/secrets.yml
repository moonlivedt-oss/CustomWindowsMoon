# Проверка на утёкшие секреты (ключи API, токены, закрытые ключи) во всей истории репозитория - gitleaks.
# Версия закреплена: и действие checkout (по коммиту), и сам gitleaks (версия и SHA-256 архива) - обновление чужого
# действия или релиза не подменит проверку молча. Нашлось - сборка красная, отчёт - в журнале шага.
name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # вся история: секрет, удалённый следующим коммитом, всё равно утёк

      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks

      - name: Scan
        run: ./gitleaks git --redact --verbose --exit-code 1 .
