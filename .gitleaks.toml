# gitleaks (.github/workflows/secrets.yml): правила по умолчанию плюс исключение для тестов. В tests/ - выдуманные
# ключи и токены: образцы для детектора секретов (core/secrets) и ключи телефонов для разбора файла. Настоящих там нет
# и быть не должно; всё остальное в репозитории проверяется целиком.
title = "RadialMenu"

[extend]
useDefault = true

[[allowlists]]
description = "Выдуманные образцы в тестах без окон"
paths = ['''^tests/tests_[a-z0-9_]+\.cpp$''']
