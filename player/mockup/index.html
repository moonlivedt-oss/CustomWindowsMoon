const TRACKS = [
  { title: 'Лунный свет над Амуром', artist: 'Северный Ветер', album: 'Тихие гавани', dur: 222 },
  { title: 'Neon Rain', artist: 'Glass Avenue', album: 'Afterhours', dur: 245 },
  { title: 'Последний трамвай до рассвета над спящим заливом', artist: 'Маяк', album: 'Береговая линия', dur: 318 },
  { title: 'Static Bloom', artist: 'Kite Theory', album: 'Paper Satellites', dur: 207 },
  { title: 'Тёплый шум', artist: 'Ольга Ветрова', album: 'Плёнка', dur: 178 },
  { title: 'Midnight Signals From The Northern Lighthouse', artist: 'The Quiet Coast', album: 'Low Tide', dur: 372 },
  { title: 'Город спит', artist: 'Кварц', album: 'Ночные окна', dur: 231 },
  { title: 'Velvet Orbit', artist: 'Solenne', album: 'Gravity Lessons', dur: 273 },
  { title: 'Снег на проводах', artist: 'Пятый этаж', album: 'Зима в стерео', dur: 196 },
  { title: 'Ultraviolet', artist: 'Mono Harbor', album: 'Signals', dur: 219 },
  { title: 'Медленный пульс', artist: 'Дельта', album: 'Синтез', dur: 287 },
  { title: 'Paper Lanterns', artist: 'Aki & The Tides', album: 'Drift', dur: 185 },
];

const SCHEMA = JSON.parse(document.getElementById('pm-schema').textContent);
const ITEMS = SCHEMA.sections.flatMap((s) => s.items.map((it) => ({ ...it, tab: s.tab })));
const ITEM = Object.fromEntries(ITEMS.map((it) => [it.key, it]));

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const root = document.documentElement;
const win = $('#win');
const cssVar = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const cssNum = (name) => parseFloat(cssVar(name)) || 0;
const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const state = {
  index: 0,
  playing: false,      // намерение пользователя (иконка)
  level: 0,            // громкость движка 0..1 (плавный старт и пауза)
  pos: 0,
  volume: 0.7,
  muted: false,
  repeat: 'off',
  shuffle: false,
  playlistOpen: false,
  mini: false,
  sysReduce: false,
  reduce: false,
  xfading: false,
  history: [],
};
let S = {};            // текущие настройки
let skinDef = {};      // значения по умолчанию текущего пресета
let baseDur = {};      // длительности пресета до умножения на скорость

/* =====================================================================
   ЦВЕТ: разбор любой CSS-строки через canvas
   ===================================================================== */
const cctx = document.createElement('canvas').getContext('2d');
function parseColor(str) {
  cctx.fillStyle = '#000';
  cctx.fillStyle = str;
  const v = cctx.fillStyle;
  if (v[0] === '#') return { r: parseInt(v.slice(1, 3), 16), g: parseInt(v.slice(3, 5), 16), b: parseInt(v.slice(5, 7), 16), a: 1 };
  const m = v.match(/[\d.]+/g).map(Number);
  return { r: m[0], g: m[1], b: m[2], a: m[3] ?? 1 };
}
const hex = ({ r, g, b }) => '#' + [r, g, b].map((x) => Math.round(x).toString(16).padStart(2, '0')).join('');
const rgba = ({ r, g, b }, a) => `rgba(${r}, ${g}, ${b}, ${+a.toFixed(3)})`;
const luminance = ({ r, g, b }) => (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;

/* =====================================================================
   ОБЛОЖКА-ЗАГЛУШКА: цвета и форма из хеша названия
   ===================================================================== */
// FNV-1a, 32 бита
function hash(str) {
  let h = 0x811c9dc5;
  for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
// Детерминированный генератор (mulberry32): из одного хеша - много чисел
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function palette(title) {
  const r = rng(hash(title));
  const h1 = r() * 360;
  const h2 = (h1 + 35 + r() * 80) % 360;
  const h3 = (h1 + 150 + r() * 70) % 360;
  const s = 62 + r() * 24;
  return {
    h3,
    a: `hsl(${h1.toFixed(0)} ${s.toFixed(0)}% ${(46 + r() * 12).toFixed(0)}%)`,
    b: `hsl(${h2.toFixed(0)} ${(s - 6).toFixed(0)}% ${(30 + r() * 14).toFixed(0)}%)`,
    c: `hsl(${h3.toFixed(0)} ${(s + 6).toFixed(0)}% ${(62 + r() * 12).toFixed(0)}%)`,
    bg1: `hsl(${h1.toFixed(0)} ${(s * 0.8).toFixed(0)}% 40%)`,
    bg2: `hsl(${h2.toFixed(0)} ${(s * 0.7).toFixed(0)}% 30%)`,
    bg3: `hsl(${h3.toFixed(0)} ${s.toFixed(0)}% 55%)`,
    ang: Math.round(r() * 360),
    x1: Math.round(15 + r() * 70), y1: Math.round(15 + r() * 55),
    x2: Math.round(r() * 100), y2: Math.round(r() * 100),
    disc: Math.round(14 + r() * 14),
    shape: Math.floor(r() * 3),
  };
}
function coverBackground(p) {
  const layers = [];
  if (p.shape === 0) {
    layers.push(`radial-gradient(circle at ${p.x1}% ${p.y1}%, ${p.c} 0 ${p.disc}%, transparent ${p.disc + 0.7}%)`);
  } else if (p.shape === 1) {
    layers.push(`linear-gradient(180deg, transparent 64%, rgba(0, 0, 0, 0.22) 64%)`);
    layers.push(`radial-gradient(circle at ${p.x1}% 64%, ${p.c} 0 ${p.disc}%, transparent ${p.disc + 0.7}%)`);
  } else {
    layers.push(`repeating-linear-gradient(${p.ang + 45}deg, rgba(255, 255, 255, 0.10) 0 10px, transparent 10px 26px)`);
    layers.push(`radial-gradient(circle at ${p.x1}% ${p.y1}%, ${p.c} 0 ${p.disc}%, transparent ${p.disc + 0.7}%)`);
  }
  layers.push(`radial-gradient(90% 90% at ${p.x2}% ${p.y2}%, ${p.c.replace(')', ' / 0.55)')} 0%, transparent 60%)`);
  layers.push(`linear-gradient(${p.ang}deg, ${p.a}, ${p.b})`);
  return layers.join(', ');
}

/* =====================================================================
   ПРУЖИНА: та же формула пойдёт в C++
   x(t) = 1 - e^(-z*w*t) * (cos(wd*t) + (z*w/wd) * sin(wd*t))
   ===================================================================== */
function springCurve(k, c) {
  const w = Math.sqrt(k), z = c / (2 * w);
  let x;
  if (z < 1 - 1e-6) {
    const wd = w * Math.sqrt(1 - z * z);
    x = (t) => 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  } else if (z <= 1 + 1e-6) {
    x = (t) => 1 - Math.exp(-w * t) * (1 + w * t);
  } else {
    const q = Math.sqrt(z * z - 1), r1 = -w * (z - q), r2 = -w * (z + q);
    x = (t) => 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
  }
  // Время успокоения: последний момент, когда отклонение больше 0.5%
  let Ts = 0.05;
  for (let t = 0; t < 3; t += 0.004) if (Math.abs(1 - x(t)) > 0.005) Ts = t;
  Ts = Math.min(2, Ts + 0.004);
  const N = 40, pts = [];
  let peak = 0;
  for (let i = 0; i <= N; i++) { const v = i === N ? 1 : +x(Ts * i / N).toFixed(4); pts.push(v); peak = Math.max(peak, v); }
  return { css: `linear(${pts.join(', ')})`, ms: Math.round(Ts * 1000), over: Math.max(0, peak - 1), x, Ts };
}

/* =====================================================================
   ЦИКЛ КАДРОВ: работает только пока есть что анимировать.
   На паузе, когда полосы опустились, rAF не запрашивается вообще.
   ===================================================================== */
const loop = { running: false, last: 0, frames: 0, sinceUi: 0 };
const rafEl = $('#raf');
function wake() {
  if (loop.running) return;
  loop.running = true;
  loop.last = performance.now();
  requestAnimationFrame(tick);
  showLoop();
}
function showLoop() {
  rafEl.classList.toggle('on', loop.running);
  rafEl.innerHTML = '<span class="dot"></span>Цикл кадров: <b>' + (loop.running ? 'идёт' : 'стоит') + '</b>, всего кадров: ' + loop.frames;
}
const engineOn = () => state.playing || state.level > 0;
function tick(now) {
  const dt = Math.min(0.05, (now - loop.last) / 1000);
  loop.last = now;
  loop.frames++;
  let busy = false;

  // Плавный старт и пауза: громкость движка идёт к 0 или 1
  const target = state.playing ? 1 : 0;
  if (state.level !== target) {
    const step = S.fade > 0 ? dt * 1000 / S.fade : 1;
    state.level = clamp(state.level + (target > state.level ? step : -step), 0, 1);
  }
  if (engineOn()) {
    busy = true;
    const rate = parseFloat(S.rate) || 1;
    if (!seekDrag.active) {
      state.pos += dt * rate;
      const dur = TRACKS[state.index].dur;
      if (canCrossfade() && state.pos >= dur - S.crossfade) startCrossfade();
      else if (state.pos >= dur) trackEnded();
    }
    updateProgress();
    if (fx.spin > 0 && S.coverShape === 'vinyl') {
      spin = (spin + dt * fx.spin) % 360;
      coverWrap.style.setProperty('--spin', spin.toFixed(2) + 'deg');
    }
  }
  if (vizStep(dt)) busy = true;
  for (const m of marquees) if (m.step(dt)) busy = true;

  if (++loop.sinceUi >= 15) { loop.sinceUi = 0; showLoop(); }
  if (busy) requestAnimationFrame(tick);
  else { loop.running = false; showLoop(); }
}

/* =====================================================================
   ВИЗУАЛИЗАТОР: симуляция спектра (шум + синусы + бит).
   Полоса или кольцо вокруг обложки в зависимости от раскладки.
   ===================================================================== */
const vizCanvas = $('#viz');
const vctx = vizCanvas.getContext('2d');
const viz = { n: 48, vals: new Float32Array(48), t: 0, w: 0, h: 0, dpr: 1, cols: [], colA: '#fff', colB: '#fff' };
let spin = 0;
// Значения, нужные каждый кадр: читаются один раз при применении настроек
const fx = { spin: 0, coverR: 0, mqSpeed: 30, mqPause: 1.6, mqGap: 48 };
function readFx() {
  fx.spin = state.reduce ? 0 : S.spin;
  fx.coverR = cssNum('--sz-cover') / 2;
  fx.mqSpeed = S.mqSpeed;
  fx.mqPause = cssNum('--mq-pause') / 1000;
  fx.mqGap = cssNum('--mq-gap');
}

function vizConfigure() {
  const n = Math.round(S.vizBars) || 48;
  if (n !== viz.n) {
    // Новый массив: старые значения растягиваются, чтобы не было скачка
    const old = viz.vals, fresh = new Float32Array(n);
    for (let i = 0; i < n; i++) fresh[i] = old[Math.floor(i * old.length / n)] || 0;
    viz.n = n; viz.vals = fresh;
  }
  const ring = S.layout === 'stage';
  const slot = ring ? $('.art') : $('#vizSlot');
  if (vizCanvas.parentElement !== slot) slot.appendChild(vizCanvas);
  vizCanvas.style.visibility = S.vizStyle === 'off' ? 'hidden' : '';
  const rect = vizCanvas.getBoundingClientRect();
  viz.dpr = window.devicePixelRatio || 1;
  viz.w = rect.width; viz.h = rect.height;
  vizCanvas.width = Math.max(1, Math.round(rect.width * viz.dpr));
  vizCanvas.height = Math.max(1, Math.round(rect.height * viz.dpr));
  vizColors();
}
// Цвет каждой полосы: интерполяция между двумя цветами по индексу
function vizColors() {
  let a, b;
  if (S.vizColor === 'cover') { const p = palette(TRACKS[state.index].title); a = p.c; b = p.a; }
  else if (S.vizColor === 'mono') { a = b = cssVar('--c-text'); }
  else { a = S.accentFromCover ? coverAccent(palette(TRACKS[state.index].title)) : S.accent; b = S.accent2; }
  const A = parseColor(a), B = parseColor(b);
  viz.colA = rgba(A, 1); viz.colB = rgba(B, 1);
  viz.cols = [];
  for (let i = 0; i < viz.n; i++) {
    const t = viz.n > 1 ? i / (viz.n - 1) : 0;
    viz.cols.push(`rgb(${Math.round(A.r + (B.r - A.r) * t)}, ${Math.round(A.g + (B.g - A.g) * t)}, ${Math.round(A.b + (B.b - A.b) * t)})`);
  }
  vizDraw();
}

// Возвращает true, если нужен следующий кадр
function vizStep(dt) {
  const v = viz.vals, n = viz.n;
  let max = 0;
  if (engineOn() && state.level > 0) {
    const rate = parseFloat(S.rate) || 1;
    viz.t += dt * rate;
    const t = viz.t;
    const beat = Math.exp(-((t % 0.469) / 0.469) * 7);   // 128 ударов в минуту
    for (let i = 0; i < n; i++) {
      const f = i / (n - 1);
      const base = 0.72 * Math.pow(1 - f, 0.55) + 0.14;
      const mod = 0.5 + 0.25 * Math.sin(t * (1.6 + f * 3.3) + i * 0.71) + 0.25 * Math.sin(t * (0.7 + f * 1.9) + i * 1.93);
      const noise = Math.random() * 0.22;
      let target = base * (0.35 + 0.55 * mod) + noise * (0.4 + f * 0.6) + beat * 0.45 * Math.pow(1 - f, 2.2);
      target = clamp(target, 0, 1) * state.level;
      if (target > v[i]) v[i] += (target - v[i]) * Math.min(1, dt * S.vizAttack);
      else v[i] = Math.max(target, v[i] - dt * S.vizFall);
      if (v[i] > max) max = v[i];
    }
  } else {
    // Пауза: плавно опускаем и останавливаемся
    for (let i = 0; i < n; i++) {
      v[i] = Math.max(0, v[i] - dt * S.vizFall * (0.6 + v[i]));
      if (v[i] > max) max = v[i];
    }
  }
  const visible = !state.mini && S.vizStyle !== 'off' && vizCanvas.offsetParent !== null;
  if (visible) vizDraw();
  if (!engineOn() && max <= 0.001) { v.fill(0); if (visible) vizDraw(); return false; }
  return true;
}

function vizDraw() {
  const ctx = vctx, n = viz.n, v = viz.vals, W = viz.w, H = viz.h, st = S.vizStyle;
  ctx.setTransform(viz.dpr, 0, 0, viz.dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!W || !H || st === 'off') return;
  const glow = state.reduce ? 0 : S.vizGlow;
  ctx.shadowBlur = glow;
  if (S.layout === 'stage') drawRing(ctx, n, v, W, H, st, glow);
  else drawStrip(ctx, n, v, W, H, st, glow);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawStrip(ctx, n, v, W, H, st, glow) {
  const gap = Math.max(1, (W / n) * 0.28);
  const bw = (W - gap * (n - 1)) / n;
  const r = Math.min(bw / 2, 3);
  if (st === 'wave') {
    // Волна: сглаженная кривая через вершины, заливка под ней
    const pts = [];
    for (let i = 0; i < n; i++) pts.push([i / (n - 1) * W, H - 1 - v[i] * (H - 3)]);
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < n - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
        ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      ctx.lineTo(pts[n - 1][0], pts[n - 1][1]);
    };
    const hg = ctx.createLinearGradient(0, 0, W, 0);
    hg.addColorStop(0, viz.colA); hg.addColorStop(1, viz.colB);
    path(); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.globalAlpha = 0.22; ctx.fillStyle = hg; ctx.shadowBlur = 0; ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = glow; ctx.shadowColor = viz.colA;
    path(); ctx.strokeStyle = hg; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    return;
  }
  for (let i = 0; i < n; i++) {
    const x = i * (bw + gap), val = v[i], col = viz.cols[i];
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    if (st === 'bars') {
      const h = Math.max(2, val * H);
      ctx.globalAlpha = 0.55 + val * 0.45;
      roundRect(ctx, x, H - h, bw, h, r); ctx.fill();
    } else if (st === 'mirror') {
      const h = Math.max(1.5, val * (H / 2 - 1));
      ctx.globalAlpha = 0.4 + val * 0.6;
      roundRect(ctx, x, H / 2 - h, bw, h * 2, r); ctx.fill();
    } else if (st === 'lines') {
      const step = (W - 2) / (n - 1), h = Math.max(1, val * H);
      ctx.globalAlpha = 0.85;
      ctx.fillRect(Math.round(i * step), H - h, 2, h);
    } else if (st === 'dots') {
      const y = H - 3 - val * (H - 6);
      ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(x + bw / 2, H - 2, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x + bw / 2, y, Math.min(2.6, bw / 2 + 0.6), 0, Math.PI * 2); ctx.fill();
    } else if (st === 'led') {
      // Сегменты: тусклая подложка и горящие ячейки
      const seg = 3, sg = 2, count = Math.max(2, Math.floor(H / (seg + sg))), lit = Math.round(val * count);
      for (let j = 0; j < count; j++) {
        ctx.globalAlpha = j < lit ? 0.5 + 0.5 * (j / count) : 0.1;
        ctx.fillRect(x, H - (j + 1) * (seg + sg) + sg, bw, seg);
      }
    }
  }
}

function drawRing(ctx, n, v, W, H, st, glow) {
  const cx = W / 2, cy = H / 2, R = fx.coverR;
  // Начало лучей зависит от формы обложки, чтобы не наезжать на углы
  const k = { square: 1.42, rounded: 1.25, circle: 1, vinyl: 1 }[S.coverShape] || 1;
  const r0 = R * k + (k > 1 ? 6 : 12);
  const maxLen = Math.max(12, Math.min(W, H) / 2 - r0 - 8);
  const half = n / 2;
  const at = (i) => { const kk = i < half ? i : n - 1 - i; return [v[Math.min(n - 1, kk * 2)], viz.cols[Math.min(n - 1, kk * 2)]]; };
  ctx.lineCap = 'round';
  if (st === 'wave') {
    // Замкнутая волна вокруг обложки
    const pts = [];
    for (let i = 0; i < n; i++) {
      const [val] = at(i), ang = -Math.PI / 2 + (i + 0.5) / n * Math.PI * 2, rr = r0 + 4 + val * maxLen;
      pts.push([cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr]);
    }
    ctx.beginPath();
    const m0 = [(pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2];
    ctx.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, viz.colA); g.addColorStop(1, viz.colB);
    ctx.globalAlpha = 0.18; ctx.fillStyle = g; ctx.shadowBlur = 0; ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = glow; ctx.shadowColor = viz.colA; ctx.strokeStyle = g; ctx.lineWidth = 2.2; ctx.stroke();
    return;
  }
  const lw = clamp((2 * Math.PI * r0 / n) * 0.45, 1.5, 5);
  for (let i = 0; i < n; i++) {
    const [val, col] = at(i);
    const ang = -Math.PI / 2 + (i + 0.5) / n * Math.PI * 2;
    const c = Math.cos(ang), s = Math.sin(ang), len = 3 + val * maxLen;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.shadowColor = col;
    let a = r0, b = r0 + len;
    if (st === 'mirror') { const rm = r0 + maxLen / 2; a = rm - len / 2; b = rm + len / 2; }
    if (st === 'bars' || st === 'mirror' || st === 'lines') {
      ctx.lineWidth = st === 'lines' ? 1.3 : lw;
      ctx.globalAlpha = 0.45 + val * 0.55;
      ctx.beginPath(); ctx.moveTo(cx + c * a, cy + s * a); ctx.lineTo(cx + c * b, cy + s * b); ctx.stroke();
    } else if (st === 'dots') {
      ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(cx + c * r0, cy + s * r0, 1.3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(cx + c * b, cy + s * b, 2.4, 0, Math.PI * 2); ctx.fill();
    } else if (st === 'led') {
      ctx.lineWidth = lw; ctx.lineCap = 'butt';
      const seg = 4, sg = 3, count = Math.floor(maxLen / (seg + sg)), lit = Math.round(val * count);
      for (let j = 0; j < count; j++) {
        const p0 = r0 + j * (seg + sg);
        ctx.globalAlpha = j < lit ? 0.55 + 0.45 * (j / count) : 0.1;
        ctx.beginPath(); ctx.moveTo(cx + c * p0, cy + s * p0); ctx.lineTo(cx + c * (p0 + seg), cy + s * (p0 + seg)); ctx.stroke();
      }
      ctx.lineCap = 'round';
    }
  }
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* =====================================================================
   БЕГУЩАЯ СТРОКА: только если текст не помещается.
   Едет, пока играет музыка; на паузе докручивает круг и останавливается.
   ===================================================================== */
class Marquee {
  constructor(el) {
    this.el = el;
    this.inner = $('.mq-inner', el);
    this.a = $('.mq-a', el);
    this.b = $('.mq-b', el);
    this.off = 0; this.hold = 0; this.active = false; this.dist = 0;
  }
  setText(t) { this.a.textContent = t; this.b.textContent = t; this.measure(); }
  measure() {
    this.off = 0;
    this.inner.style.transform = '';
    this.el.classList.remove('is-marquee', 'is-moving');
    this.el.classList.toggle('no-mq', state.reduce);
    if (state.reduce || this.el.offsetParent === null) { this.active = false; return; }
    const tw = this.a.getBoundingClientRect().width;
    const cw = this.el.clientWidth;
    this.active = tw > cw + 1;
    this.el.classList.toggle('is-marquee', this.active);
    this.dist = tw + fx.mqGap;
    this.hold = fx.mqPause;
    if (this.active) wake();
  }
  step(dt) {
    if (!this.active) return false;
    if (!state.playing && this.off === 0) return false;
    if (state.playing && this.hold > 0) { this.hold -= dt; return true; }
    if (state.playing) this.off += fx.mqSpeed * dt;
    // На паузе быстро докручиваем круг до шва (ease-out), чтобы текст встал на место
    else this.off += Math.max(fx.mqSpeed * dt, (this.dist - this.off) * Math.min(1, dt * 6));
    if (this.off >= this.dist - 0.5) { this.off = 0; this.hold = fx.mqPause; }
    this.inner.style.transform = `translateX(${-this.off.toFixed(2)}px)`;
    this.el.classList.toggle('is-moving', this.off > 0);
    return state.playing || this.off !== 0;
  }
}
const marquees = [new Marquee($('#title')), new Marquee($('#miniTitle'))];
const remeasure = () => marquees.forEach((m) => m.measure());

/* =====================================================================
   ПОЛЗУНКИ ПЛЕЕРА: перемотка и громкость
   ===================================================================== */
class Slider {
  constructor(el, { onInput, onCommit }) {
    this.el = el; this.onInput = onInput; this.onCommit = onCommit;
    this.active = false; this.moved = false;
    el.addEventListener('pointerdown', (e) => this.down(e));
    el.addEventListener('pointermove', (e) => this.move(e));
    el.addEventListener('pointerup', (e) => this.up(e));
    el.addEventListener('pointercancel', (e) => this.up(e));
    el.addEventListener('keydown', (e) => {
      const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 0.05 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -0.05 : 0;
      if (!d) return;
      e.preventDefault();
      const v = clamp(this.value() + d, 0, 1);
      this.jump(v);
      this.onCommit(v);
    });
  }
  value() { return parseFloat(this.el.style.getPropertyValue('--v')) || 0; }
  set(v) { this.el.style.setProperty('--v', v.toFixed(4)); }
  // Клик: значение доезжает плавно
  jump(v) {
    this.el.classList.add('jump');
    this.set(v);
    clearTimeout(this.jt);
    this.jt = setTimeout(() => this.el.classList.remove('jump'), cssNum('--dur-base') + 30);
  }
  at(e) { const r = this.el.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); }
  down(e) {
    if (e.button !== 0) return;
    this.el.setPointerCapture(e.pointerId);
    this.active = true; this.moved = false; this.x0 = e.clientX;
    this.el.classList.add('drag');
    const v = this.at(e);
    this.jump(v);
    this.onInput(v);
  }
  move(e) {
    if (!this.active) return;
    if (!this.moved && Math.abs(e.clientX - this.x0) < 3) return;
    this.moved = true;
    // При перетаскивании ручка идёт строго за мышью, без задержки
    this.el.classList.remove('jump');
    const v = this.at(e);
    this.set(v);
    this.onInput(v);
  }
  up(e) {
    if (!this.active) return;
    this.active = false;
    this.el.classList.remove('drag');
    this.onCommit(this.at(e));
  }
}

const tCur = $('#tCur'), tDur = $('#tDur');
const seekDrag = { active: false };
let lastSec = -1;
function seekCommit(v) {
  seekDrag.active = false;
  state.pos = v * TRACKS[state.index].dur;
  updateProgress(true);
}
const seekSliders = [];
for (const id of ['#seek', '#miniSeek']) {
  const s = new Slider($(id), {
    onInput: (v) => { seekDrag.active = true; tCur.textContent = fmt(v * TRACKS[state.index].dur); seekSliders.forEach((o) => o !== s && o.set(v)); },
    onCommit: seekCommit,
  });
  seekSliders.push(s);
}
function updateProgress(force) {
  const dur = TRACKS[state.index].dur;
  const v = clamp(state.pos / dur, 0, 1);
  for (const s of seekSliders) if (!s.active) s.set(v);
  const sec = Math.floor(state.pos);
  if (sec !== lastSec || force) { lastSec = sec; if (!seekDrag.active) tCur.textContent = fmt(state.pos); }
}

const volEl = $('#vol');
const volSlider = new Slider($('#volume'), { onInput: (v) => setVolume(v), onCommit: (v) => setVolume(v) });
function setVolume(v) {
  state.volume = v;
  if (v > 0 && state.muted) state.muted = false;
  renderVolume();
}
function renderVolume() {
  const v = state.muted ? 0 : state.volume;
  volSlider.set(v);
  volEl.classList.toggle('is-muted', state.muted || v === 0);
  // Волны динамика гаснут по мере уменьшения громкости
  $('.w1', volEl).style.opacity = v > 0.02 ? 1 : 0.15;
  $('.w2', volEl).style.opacity = v > 0.5 ? 1 : 0.15;
}

/* =====================================================================
   СМЕНА ТРЕКА: обложка, текст, цвета окна
   ===================================================================== */
const coverWrap = $('#coverWrap');
const miniCover = $('#miniCover');
const winArt = $('#winArt');
const titleEl = $('#title'), artistEl = $('#artist'), albumEl = $('#album');
const miniArtist = $('#miniArtist');
const plList = $('#plList');

// Анимации обложки: out - уходящая, in - новая. dir: 1 вперёд, -1 назад.
// Время задаётся долями от длительности: outD/inD - доля, inDelay - задержка.
const P3 = 'perspective(900px) ';
const COVER_FX = {
  fade: () => ({
    out: [{ opacity: 1 }, { opacity: 0 }],
    in: [{ opacity: 0 }, { opacity: 1 }],
  }),
  slide: (d) => ({
    out: [{ transform: 'translateX(0)' }, { transform: `translateX(${-d * 100}%)` }],
    in: [{ transform: `translateX(${d * 100}%)` }, { transform: 'translateX(0)' }], outD: 1,
  }),
  zoom: (d) => ({
    out: [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: `translateX(${-d * 24}px) scale(0.9)` }],
    in: [{ opacity: 0, transform: `translateX(${d * 24}px) scale(1.06)` }, { opacity: 1, transform: 'none' }],
  }),
  rotate: (d) => ({
    out: [{ opacity: 1, transform: 'rotate(0) scale(1)' }, { opacity: 0, transform: `rotate(${-d * 40}deg) scale(0.75)` }],
    in: [{ opacity: 0, transform: `rotate(${d * 40}deg) scale(0.75)` }, { opacity: 1, transform: 'rotate(0) scale(1)' }], inEase: 'spring',
  }),
  flip: (d) => ({
    out: [{ transform: P3 + 'rotateY(0deg)' }, { transform: P3 + `rotateY(${-d * 90}deg)` }], outD: 0.5,
    in: [{ transform: P3 + `rotateY(${d * 90}deg)` }, { transform: P3 + 'rotateY(0deg)' }], inD: 0.5, inDelay: 0.5,
  }),
  wipe: (d) => ({
    out: [{ opacity: 1 }, { opacity: 1 }], outD: 1,
    in: [{ clipPath: d > 0 ? 'inset(0 0 0 100%)' : 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }],
  }),
  blur: () => ({
    out: [{ opacity: 1, filter: 'blur(0px)', transform: 'scale(1)' }, { opacity: 0, filter: 'blur(14px)', transform: 'scale(1.05)' }],
    in: [{ opacity: 0, filter: 'blur(14px)', transform: 'scale(0.96)' }, { opacity: 1, filter: 'blur(0px)', transform: 'scale(1)' }],
  }),
};

function makeCover(bg) { const d = document.createElement('div'); d.className = 'cover'; d.style.background = bg; return d; }

function swapCover(container, bg, dir, animate, kind, durOverride) {
  const old = [...container.querySelectorAll('.cover')];
  const fresh = makeCover(bg);
  container.appendChild(fresh);
  if (!animate) { old.forEach((o) => o.remove()); return; }
  const f = COVER_FX[state.reduce ? 'fade' : kind](dir);
  const dur = durOverride || cssNum('--dur-cover');
  const easeOut = cssVar('--ease-out'), easeIn = cssVar('--ease-in');
  const inEase = f.inEase === 'spring' && !durOverride ? cssVar('--ease-spring') : easeOut;
  for (const o of old) {
    o.getAnimations().forEach((a) => a.cancel());
    o.animate(f.out, { duration: dur * (f.outD || 0.8), easing: f.outD === 1 ? easeOut : easeIn, fill: 'forwards' })
      .finished.then(() => o.remove(), () => {});
  }
  fresh.animate(f.in, { duration: dur * (f.inD || 1), delay: dur * (f.inDelay || 0), easing: inEase, fill: 'backwards' });
}

// Анимации текста. Уход короче прихода.
const TEXT_FX = {
  rise: () => ({ out: [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px)' }], in: [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }] }),
  slide: (d) => ({ out: [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-d * 16}px)` }], in: [{ opacity: 0, transform: `translateX(${d * 16}px)` }, { opacity: 1, transform: 'none' }] }),
  fade: () => ({ out: [{ opacity: 1 }, { opacity: 0 }], in: [{ opacity: 0 }, { opacity: 1 }] }),
  blur: () => ({ out: [{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(6px)' }], in: [{ opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)' }] }),
  wipe: () => ({ out: [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 100% 0)' }], in: [{ clipPath: 'inset(100% 0 0 0)', transform: 'translateY(35%)' }, { clipPath: 'inset(0 0 0 0)', transform: 'none' }] }),
};

function swapText(entries, dir, animate) {
  const put = ([el, t, fn]) => (fn ? fn(t) : (el.textContent = t));
  if (!animate) {
    entries.forEach((e) => { e[0]._swapToken = (e[0]._swapToken || 0) + 1; e[0].getAnimations().forEach((a) => a.cancel()); put(e); });
    return;
  }
  const f = TEXT_FX[state.reduce ? 'fade' : S.textFx](dir);
  const dur = cssNum('--dur-text');
  const easeOut = cssVar('--ease-out'), easeIn = cssVar('--ease-in');
  entries.forEach((entry, i) => {
    const el = entry[0];
    // Свой токен у каждого элемента: быстрые клики отменяют только его же анимации
    const token = el._swapToken = (el._swapToken || 0) + 1;
    el.getAnimations().forEach((a) => a.cancel());
    const out = el.animate(f.out, { duration: dur * 0.45, delay: i * 30, easing: easeIn, fill: 'forwards' });
    out.finished.then(() => {
      if (token !== el._swapToken) return;
      put(entry);
      el.animate(f.in, { duration: dur, easing: easeOut });
      out.cancel();
    }, () => {});
  });
}

// Акцент из обложки: светлый для тёмных тем, тёмный для светлых
function coverAccent(p) {
  const dark = luminance(parseColor(S.text)) > 0.5;
  return `hsl(${p.h3.toFixed(0)} ${dark ? 90 : 72}% ${dark ? 66 : 40}%)`;
}
function applyTrackColors() {
  const p = palette(TRACKS[state.index].title);
  root.style.setProperty('--c1', p.bg1);
  root.style.setProperty('--c2', p.bg2);
  root.style.setProperty('--c3', p.bg3);
  root.style.setProperty('--c-accent', S.accentFromCover ? coverAccent(p) : S.accent);
}

function setTrack(i, dir = 1, animate = true, xfMs = 0) {
  const prevIndex = state.index;
  state.index = (i + TRACKS.length) % TRACKS.length;
  state.pos = 0;
  state.xfading = false;
  const tr = TRACKS[state.index];
  const bg = coverBackground(palette(tr.title));
  // Фон окна и акцент перетекают (переход задан в CSS на :root)
  if (xfMs) {
    root.style.setProperty('--dur-bg', xfMs + 'ms');
    clearTimeout(setTrack.t);
    setTrack.t = setTimeout(() => root.style.setProperty('--dur-bg', baseDurMs('bg') + 'ms'), xfMs + 50);
  }
  applyTrackColors();
  const kind = xfMs ? 'fade' : S.coverFx;
  swapCover(coverWrap, bg, dir, animate && !state.mini, kind, xfMs);
  swapCover(miniCover, bg, dir, animate && state.mini, 'fade', xfMs);
  swapCover(winArt, bg, dir, animate, 'fade', xfMs || cssNum('--dur-slow') * 2);
  const setTitle = (t) => marquees[0].setText(t);
  const setMiniTitle = (t) => marquees[1].setText(t);
  swapText([[titleEl, tr.title, setTitle], [artistEl, tr.artist], [albumEl, tr.album]], dir, animate && !state.mini);
  swapText([[$('#miniTitle'), tr.title, setMiniTitle], [miniArtist, tr.artist]], dir, animate && state.mini);
  tDur.textContent = fmt(tr.dur);
  $('#counter').textContent = String(state.index + 1).padStart(2, '0') + ' / ' + TRACKS.length;
  $$('.row', plList).forEach((r, k) => r.classList.toggle('current', k === state.index));
  if (prevIndex !== state.index) state.history.push(prevIndex);
  renderXfZone();
  updateProgress(true);
  if (S.vizColor !== 'accent' || S.accentFromCover) setTimeout(vizColors, xfMs || cssNum('--dur-bg'));
}

function nextIndex() {
  if (state.shuffle) {
    let k = state.index;
    while (k === state.index) k = Math.floor(Math.random() * TRACKS.length);
    return k;
  }
  return state.index + 1;
}
function next(auto = false) {
  if (auto && !state.shuffle && state.repeat === 'off' && state.index === TRACKS.length - 1) {
    setTrack(0, 1); setPlaying(false); return;
  }
  setTrack(nextIndex(), 1);
}
function prev() {
  if (state.pos > 3) { state.pos = 0; seekSliders.forEach((s) => s.jump(0)); updateProgress(true); return; }
  if (state.shuffle && state.history.length) { const k = state.history.pop(); setTrack(k, -1); state.history.pop(); return; }
  setTrack(state.index - 1, -1);
}
function trackEnded() {
  if (state.repeat === 'one') { state.pos = 0; return; }
  if (S.stopAfter) {
    // Одноразовый флажок: останавливаемся и снимаем его
    setTrack(nextIndex(), 1); state.level = 0; setPlaying(false);
    setSetting('stopAfter', false);
    return;
  }
  next(true);
}
// Кроссфейд: следующий трек стартует заранее, обложка и фон перетекают всё это время
function canCrossfade() {
  if (!(S.crossfade > 0) || state.xfading || state.repeat === 'one' || S.stopAfter) return false;
  if (!state.shuffle && state.repeat === 'off' && state.index === TRACKS.length - 1) return false;
  return TRACKS[state.index].dur > S.crossfade * 2;
}
function startCrossfade() {
  state.xfading = true;
  const ms = Math.round(S.crossfade * 1000);
  $('#state').textContent = 'Переход';
  setTrack(nextIndex(), 1, true, state.reduce ? 0 : ms);
}
function renderXfZone() {
  const dur = TRACKS[state.index].dur;
  $('.xf-zone').style.width = (S.crossfade > 0 ? (S.crossfade / dur) * 100 : 0) + '%';
}

function setPlaying(on, user = false) {
  state.playing = on;
  if (!(S.fade > 0)) state.level = on ? 1 : 0;
  win.classList.toggle('is-playing', on);
  $$('[data-act="play"]').forEach((b) => { b.title = on ? 'Пауза' : 'Воспроизвести'; b.setAttribute('aria-label', b.title); });
  $('#state').textContent = on ? 'Играет' : 'Пауза';
  if (on) marquees.forEach((m) => { if (m.off === 0) m.hold = fx.mqPause; });
  if (user) playFx();
  wake();
}
// Дополнительный эффект кнопки пуска поверх морфинга
function playFx() {
  if (state.reduce || S.playFx === 'morph') return;
  for (const b of $$('.btn.play')) {
    if (b.offsetParent === null) continue;
    const svg = $('svg', b);
    if (S.playFx === 'rotate') {
      svg.animate([{ transform: 'rotate(-90deg) scale(0.7)' }, { transform: 'none' }], { duration: cssNum('--dur-spring'), easing: cssVar('--ease-spring') });
    } else if (S.playFx === 'pulse') {
      const r = document.createElement('span');
      r.className = 'ripple';
      b.appendChild(r);
      r.animate([{ transform: 'scale(1)', opacity: 0.7 }, { transform: 'scale(1.7)', opacity: 0 }], { duration: cssNum('--dur-slow') * 1.6, easing: cssVar('--ease-out') })
        .finished.then(() => r.remove(), () => r.remove());
      svg.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: cssNum('--dur-base') * 1.4, easing: cssVar('--ease-out') });
    }
  }
}

/* =====================================================================
   ПЛЕЙЛИСТ
   ===================================================================== */
function buildPlaylist() {
  plList.innerHTML = '';
  TRACKS.forEach((t, k) => {
    const li = document.createElement('li');
    li.className = 'row';
    li.tabIndex = 0;
    li.innerHTML = `<div class="row-num"><span>${String(k + 1).padStart(2, '0')}</span><div class="eq"><i></i><i></i><i></i></div></div>
      <div class="row-text"><div class="row-title"></div><div class="row-artist"></div></div>
      <div class="row-dur">${fmt(t.dur)}</div>`;
    $('.row-title', li).textContent = t.title;
    $('.row-artist', li).textContent = t.artist;
    li.title = t.title;
    const pick = () => {
      if (k === state.index) { setPlaying(!state.playing, true); return; }
      setTrack(k, k > state.index ? 1 : -1);
      setPlaying(true, true);
    };
    li.addEventListener('click', pick);
    li.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    plList.appendChild(li);
  });
  const total = TRACKS.reduce((a, t) => a + t.dur, 0);
  $('#plCount').textContent = TRACKS.length + ' треков, ' + Math.round(total / 60) + ' мин';
}

function setPlaylist(open) {
  if (state.mini && open) return;
  state.playlistOpen = open;
  win.classList.toggle('pl-open', open);
  const b = $('.pl-btn');
  b.classList.toggle('is-on', open);
  b.setAttribute('aria-pressed', String(open));
  if (open && !state.reduce) {
    // Строки появляются лесенкой
    const st = cssNum('--dur-stagger');
    const sheet = S.playlist === 'sheet';
    $$('.row', plList).forEach((r, k) => {
      r.animate([{ opacity: 0, transform: `translate(${sheet ? 0 : 16}px, ${sheet ? 14 : 0}px)` }, { opacity: 1, transform: 'none' }],
        { duration: cssNum('--dur-slow'), delay: 60 + k * st, easing: cssVar('--ease-out'), fill: 'backwards' });
    });
    const cur = $$('.row', plList)[state.index];
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
}

/* =====================================================================
   МИНИ-РЕЖИМ
   ===================================================================== */
function setMini(on) {
  if (on === state.mini) return;
  if (on && state.playlistOpen) setPlaylist(false);
  state.mini = on;
  win.classList.toggle('is-mini', on);
  $('#pageMini').textContent = on ? 'Полный режим' : 'Мини-режим';
  setTimeout(() => { remeasure(); if (!on) vizConfigure(); wake(); }, cssNum('--dur-fast') + 10);
}

/* =====================================================================
   НАСТРОЙКИ: значения по умолчанию из CSS пресета, применение к окну
   ===================================================================== */
const DUR_KEYS = ['fast', 'base', 'slow', 'cover', 'text', 'bg', 'resize', 'press', 'stagger'];
const baseDurMs = (k) => Math.round((state.reduce ? 0.35 : S.speed) * baseDur[k]);

// Читает пресет: data-skin на <html>, inline-переопределения сняты
function readSkin(skin) {
  root.removeAttribute('style');
  // Без переходов: иначе прочитается промежуточный цвет предыдущего пресета
  root.style.transition = 'none';
  root.dataset.skin = skin;
  const cs = getComputedStyle(root);
  const d = {};
  for (const it of ITEMS) {
    if (it.default !== undefined) { d[it.key] = it.default; continue; }
    if (!it.src) continue;
    const raw = cs.getPropertyValue(it.src).trim();
    if (it.type === 'color') d[it.key] = hex(parseColor(raw));
    else if (it.type === 'toggle') d[it.key] = raw === '1';
    else if (it.type === 'range') d[it.key] = it.key === 'winDensity' ? +parseColor(raw).a.toFixed(2) : parseFloat(raw);
    else d[it.key] = raw;
  }
  d.skin = skin;
  baseDur = {};
  for (const k of DUR_KEYS) baseDur[k] = parseFloat(cs.getPropertyValue('--dur-' + k));
  root.style.removeProperty('transition');
  return d;
}

// Пресет по имени: все настройки сбрасываются на его значения,
// настройки воспроизведения (theme: false) сохраняются
function loadSkin(skin, overrides = {}) {
  const keep = {};
  for (const it of ITEMS) if (it.theme === false && S[it.key] !== undefined) keep[it.key] = S[it.key];
  skinDef = readSkin(skin);
  S = { ...skinDef, ...keep, ...overrides, skin };
}

function applySettings() {
  const st = root.style;
  state.reduce = state.sysReduce || S.motion === 'none';
  root.classList.toggle('reduce', state.reduce);
  Object.assign(root.dataset, {
    layout: S.layout, playlist: S.playlist, coverShape: S.coverShape, backdrop: S.backdrop,
    shadow: S.shadow, btn: state.reduce ? 'none' : S.btnFx, desk: S.desk,
  });

  // Цвета
  st.setProperty('--c-accent-2', S.accent2);
  st.setProperty('--c-text', S.text);
  if (S.text.toLowerCase() !== skinDef.text.toLowerCase()) {
    st.setProperty('--c-text-2', `color-mix(in srgb, ${S.text} 74%, transparent)`);
    st.setProperty('--c-text-3', `color-mix(in srgb, ${S.text} 58%, transparent)`);
  } else { st.removeProperty('--c-text-2'); st.removeProperty('--c-text-3'); }
  const base = parseColor(S.winColor);
  st.setProperty('--c-win-base', rgba(base, S.winDensity));
  st.setProperty('--c-win-solid', hex(base));
  applyTrackColors();

  // Эффекты и геометрия
  st.setProperty('--fx-tint', S.tint);
  st.setProperty('--fx-blur', S.blur + 'px');
  st.setProperty('--fx-noise', S.noise);
  st.setProperty('--fx-grid', S.grid);
  st.setProperty('--fx-cover-ambient', S.ambient);
  st.setProperty('--fx-glow', S.glow);
  st.setProperty('--r-win', S.radius + 'px');
  st.setProperty('--fx-text-scale', S.textScale);
  st.setProperty('--fw-title', S.titleWeight);
  if (S.desk === 'custom') st.setProperty('--desk-color', S.deskColor); else st.removeProperty('--desk-color');
  root.dataset.deskTone = deskTone();

  // Движение: кривые и длительности
  const ch = SCHEMA.characters[S.motion] || SCHEMA.characters.soft;
  if (state.reduce) {
    for (const k of DUR_KEYS) st.setProperty('--dur-' + k, Math.round(baseDur[k] * 0.35) + 'ms');
    st.setProperty('--dur-resize', '1ms');
    st.setProperty('--dur-stagger', '0ms');
    st.setProperty('--ease-spring', 'linear(0, 1)');
    st.setProperty('--dur-spring', '80ms');
    st.setProperty('--ease-out', 'cubic-bezier(0.22, 1, 0.36, 1)');
  } else {
    const sp = springCurve(S.stiffness, S.damping);
    for (const k of DUR_KEYS) st.setProperty('--dur-' + k, Math.round(baseDur[k] * S.speed) + 'ms');
    st.setProperty('--ease-spring', sp.css);
    st.setProperty('--dur-spring', Math.round(sp.ms * S.speed) + 'ms');
    st.setProperty('--ease-out', `cubic-bezier(${ch.ease.join(', ')})`);
  }
  st.setProperty('--mq-speed', S.mqSpeed);
  if (state.reduce || S.coverShape !== 'vinyl') coverWrap.style.removeProperty('--spin');

  readFx();
  vizConfigure();
  remeasure();
  renderXfZone();
  $('#rate').textContent = S.rate + 'x';
  $('#rate').classList.toggle('on', S.rate !== '1');
  syncPanel();
  saveCurrent();
}

function deskTone() {
  if (S.desk === 'paper') return 'light';
  if (S.desk === 'custom') return luminance(parseColor(S.deskColor)) > 0.6 ? 'light' : 'dark';
  return 'dark';
}

// Структурные изменения (пресет, раскладка, плейлист) - через затухание окна
let switching = Promise.resolve();
function structural(fn) {
  if (state.reduce) { fn(); afterLayout(); return; }
  switching = switching.then(async () => {
    win.classList.add('switching');
    await wait(150);
    fn();
    win.classList.remove('switching');
    win.classList.add('appearing');
    afterLayout();
    await wait(320);
    win.classList.remove('appearing');
  });
}
// Размер окна меняется переходом: после него пересчитываем холст и строки
function afterLayout() {
  clearTimeout(afterLayout.t);
  afterLayout.t = setTimeout(() => { vizConfigure(); remeasure(); wake(); }, cssNum('--dur-resize') + 40);
}

function setSetting(key, value) {
  const it = ITEM[key];
  if (key === 'skin') { structural(() => { loadSkin(value); applySettings(); placeSegIndicator(); }); return; }
  S[key] = value;
  if (key === 'motion' && value !== 'none') {
    // Характер задаёт пружину и скорость сразу
    const ch = SCHEMA.characters[value];
    S.stiffness = ch.stiffness; S.damping = ch.damping; S.speed = ch.speed;
  }
  if (it && it.struct) structural(applySettings);
  else applySettings();
}

/* =====================================================================
   ПАНЕЛЬ НАСТРОЕК: строится из схемы
   ===================================================================== */
const stBody = $('#stBody'), stTabs = $('#stTabs');
const controls = {};       // key -> функция синхронизации контрола
let activeTab = 'look';

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
function svgIcon(d) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 16 16');
  s.innerHTML = d;
  return s;
}
const fmtVal = (it, v) => {
  const d = it.step < 0.01 ? 3 : it.step < 1 ? 2 : 0;
  return String(+(+v).toFixed(d)) + (it.unit || '');
};

function buildPanel() {
  for (const [id, label] of SCHEMA.tabs) {
    stTabs.append(el('button', { role: 'tab', 'data-tab': id, 'aria-selected': 'false', onclick: () => setTab(id) }, label));
  }
  for (const sec of SCHEMA.sections) {
    const box = el('section', { class: 'st-sec', 'data-tab': sec.tab }, el('h3', {}, sec.title));
    for (const it of sec.items) box.append(buildControl(it));
    stBody.append(box);
  }
}

function buildControl(it) {
  const row = el('div', { class: 'st-row' });
  const lab = el('label', {}, it.label);
  if (it.type === 'seg') {
    row.classList.add('wide');
    const seg = el('div', { class: 'st-seg' });
    for (const [v, l] of it.options) seg.append(el('button', { 'data-v': v, 'aria-pressed': 'false', onclick: () => setSetting(it.key, v) }, l));
    row.append(lab, seg);
    controls[it.key] = () => $$('button', seg).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === String(S[it.key]))));
  } else if (it.type === 'range') {
    const out = el('span', { class: 'st-val' });
    const inp = el('input', { type: 'range', min: it.min, max: it.max, step: it.step, 'aria-label': it.label });
    inp.addEventListener('input', () => { out.textContent = fmtVal(it, inp.value); setSetting(it.key, parseFloat(inp.value)); });
    row.append(lab, out, inp);
    controls[it.key] = () => { inp.value = S[it.key]; out.textContent = fmtVal(it, S[it.key]); };
  } else if (it.type === 'color') {
    const code = el('code');
    const inp = el('input', { type: 'color', 'aria-label': it.label });
    inp.addEventListener('input', () => { code.textContent = inp.value; setSetting(it.key, inp.value); });
    row.append(lab, el('div', { class: 'st-color' }, code, inp));
    controls[it.key] = () => { inp.value = S[it.key]; code.textContent = S[it.key]; };
  } else if (it.type === 'toggle') {
    const sw = el('button', { class: 'st-switch', role: 'switch', 'aria-label': it.label, onclick: () => setSetting(it.key, !S[it.key]) });
    row.append(lab, sw);
    controls[it.key] = () => sw.setAttribute('aria-checked', String(!!S[it.key]));
  } else if (it.type === 'skins') {
    row.classList.add('wide');
    const grid = el('div', { class: 'st-skins' });
    for (const [id, name] of SCHEMA.skins) {
      grid.append(el('button', { class: 'st-skin', 'data-v': id, 'aria-pressed': 'false', onclick: () => setSetting('skin', id) },
        el('span', { class: 'sw', 'data-sw': id }), name));
    }
    row.append(grid, el('div', { class: 'st-hint' }, it.hint));
    controls.skin = () => $$('.st-skin', grid).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.skin)));
  } else if (it.type === 'curve') {
    row.classList.add('wide');
    const box = el('div', { class: 'st-curve' });
    box.innerHTML = '<svg viewBox="0 0 300 86" preserveAspectRatio="none"><line x1="0" x2="300" stroke="#44444f" stroke-dasharray="3 3"/><path class="ease" fill="none" stroke="#6b6b78" stroke-width="1.5" stroke-dasharray="4 3"/><path class="spr" fill="none" stroke="#8b7dff" stroke-width="2"/></svg><div class="cap"><span class="c1"></span><span class="c2"></span></div>';
    row.append(box);
    controls.curve = () => drawCurve(box);
  } else if (it.type === 'action') {
    row.classList.add('wide');
    row.append(el('div', { class: 'st-btns' }, el('button', { class: 'st-btn', onclick: () => { next(); setPlaying(true); } }, it.label)));
  } else if (it.type === 'themes') {
    row.classList.add('wide');
    buildThemesUI(row);
  }
  return row;
}

// Кривая пружины и ease-out, ось Y от -0.1 до 1.35
function drawCurve(box) {
  const sp = springCurve(S.stiffness, S.damping);
  const ch = SCHEMA.characters[S.motion] || SCHEMA.characters.soft;
  const W = 300, H = 86, y = (v) => H - 6 - (v + 0.1) / 1.45 * (H - 12);
  let d = '';
  for (let i = 0; i <= 60; i++) d += (i ? 'L' : 'M') + (i / 60 * W).toFixed(1) + ' ' + y(sp.x(sp.Ts * i / 60)).toFixed(1);
  $('.spr', box).setAttribute('d', d);
  // cubic-bezier для сравнения: параметрическая кривая
  const [x1, y1, x2, y2] = ch.ease;
  const bz = (t, a, b) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
  let e = '';
  for (let i = 0; i <= 40; i++) { const t = i / 40; e += (i ? 'L' : 'M') + (bz(t, x1, x2) * W).toFixed(1) + ' ' + y(bz(t, y1, y2)).toFixed(1); }
  $('.ease', box).setAttribute('d', e);
  $('line', box).setAttribute('y1', y(1)); $('line', box).setAttribute('y2', y(1));
  $('.c1', box).textContent = `пружина: ${Math.round(sp.ms * S.speed)} мс, перелёт ${(sp.over * 100).toFixed(1)}%`;
  $('.c2', box).textContent = 'пунктир: ease-out';
}

function setTab(id) {
  activeTab = id;
  $$('button', stTabs).forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  $$('.st-sec', stBody).forEach((s) => s.classList.toggle('on', s.dataset.tab === id));
  $$('.st-sec.on', stBody).forEach((s, i) => s.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 220, delay: i * 30, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'backwards' }));
  stBody.scrollTop = 0;
  placeTabIndicator();
}
function placeTabIndicator() {
  const b = $(`button[data-tab="${activeTab}"]`, stTabs);
  if (!b) return;
  const ind = $('.st-tab-ind', stTabs);
  ind.style.width = b.offsetWidth + 'px';
  ind.style.transform = `translateX(${b.offsetLeft - 3}px)`;
}
function syncPanel() {
  for (const k in controls) controls[k]();
}
function setSettingsOpen(open) {
  document.body.classList.toggle('st-open', open);
  $('#pageSettings').setAttribute('aria-pressed', String(open));
  if (open) requestAnimationFrame(placeTabIndicator);
  afterLayout();
}

// Миниатюры пресетов: цвета читаются из CSS каждого пресета
function buildSkinPreviews() {
  const cur = root.dataset.skin;
  const prev = {};
  root.style.transition = 'none';
  for (const [id] of SCHEMA.skins) {
    root.dataset.skin = id;
    const cs = getComputedStyle(root);
    prev[id] = { base: cs.getPropertyValue('--c-win-base').trim(), acc: cs.getPropertyValue('--c-accent').trim(), acc2: cs.getPropertyValue('--c-accent-2').trim(), text: cs.getPropertyValue('--c-text').trim() };
  }
  root.dataset.skin = cur;
  root.style.removeProperty('transition');
  for (const sw of $$('[data-sw]')) {
    const p = prev[sw.dataset.sw];
    sw.style.background = `linear-gradient(${p.base}, ${p.base}), linear-gradient(135deg, #4a3c8c, #1d5a6a)`;
    sw.innerHTML = `<i style="left:10px;top:12px;width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg, ${p.acc}, ${p.acc2})"></i>`
      + `<i style="left:40px;top:15px;width:36px;height:5px;border-radius:3px;background:${p.text};opacity:.85"></i>`
      + `<i style="left:40px;top:25px;width:22px;height:4px;border-radius:2px;background:${p.text};opacity:.45"></i>`
      + `<i style="left:10px;top:42px;width:66px;height:3px;border-radius:2px;background:${p.acc}"></i>`;
  }
}

/* =====================================================================
   ТЕМЫ: сохранение, экспорт и импорт
   Файл: { format: "playermoon-theme", version: 1, name, settings }
   ===================================================================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* хранилище недоступно - работаем без него */ } },
};
const themeKeys = () => ITEMS.filter((it) => it.theme !== false && !['curve', 'action', 'themes'].includes(it.type)).map((it) => it.key);
function themeOf(s) { const o = {}; for (const k of themeKeys()) o[k] = s[k]; return o; }

// Проверка входящих данных: неизвестные ключи и неверные значения отбрасываются
function sanitize(obj) {
  const out = {};
  if (!obj || typeof obj !== 'object') return out;
  for (const it of ITEMS) {
    if (!(it.key in obj)) continue;
    const v = obj[it.key];
    if (it.type === 'skins') { if (SCHEMA.skins.some(([id]) => id === v)) out.skin = v; }
    else if (it.type === 'seg') { if (it.options.some(([o]) => o === String(v))) out[it.key] = String(v); }
    else if (it.type === 'range') { if (v !== null && v !== '' && Number.isFinite(+v)) out[it.key] = clamp(+v, it.min, it.max); }
    else if (it.type === 'color') { if (/^#[0-9a-f]{6}$/i.test(v)) out[it.key] = v.toLowerCase(); }
    else if (it.type === 'toggle') { if (typeof v === 'boolean') out[it.key] = v; }
  }
  return out;
}
function applyTheme(settings) {
  const clean = sanitize(settings);
  structural(() => { loadSkin(clean.skin || S.skin, clean); applySettings(); placeSegIndicator(); });
}
let saveT = 0;
function saveCurrent() {
  clearTimeout(saveT);
  saveT = setTimeout(() => store.set('pm.current', S), 300);
}

let themesList, nameInput;
function buildThemesUI(row) {
  nameInput = el('input', { class: 'st-input', type: 'text', maxlength: '40', placeholder: 'Название темы', 'aria-label': 'Название темы' });
  themesList = el('div', { class: 'st-themes' });
  row.append(
    nameInput,
    el('div', { class: 'st-btns' },
      el('button', { class: 'st-btn primary', onclick: saveTheme }, svgIcon('<path d="M3 8.5l3 3 7-7"/>'), 'Сохранить текущую'),
      el('button', { class: 'st-btn', onclick: randomTheme }, svgIcon('<path d="M2 5h2.5c1.6 0 2.6.8 3.4 2.2l1.2 1.9c.8 1.3 1.8 1.9 3.4 1.9H14M2 11h2.5c1 0 1.8-.3 2.4-1M9.6 6c.6-.7 1.4-1 2.4-1H14M12 3l2 2-2 2M12 9l2 2-2 2"/>'), 'Случайная'),
      el('button', { class: 'st-btn', onclick: () => setSetting('skin', S.skin) }, svgIcon('<path d="M3 8a5 5 0 1 0 1.5-3.5M3 2.5V5h2.5"/>'), 'Сбросить к пресету'),
    ),
    el('div', { class: 'st-hint' }, 'Сохранённые темы:'),
    themesList,
    el('div', { class: 'st-btns' },
      el('button', { class: 'st-btn', onclick: exportTheme }, svgIcon('<path d="M8 2v8M5 7l3 3 3-3M3 12.5h10"/>'), 'Экспорт в файл'),
      el('button', { class: 'st-btn', onclick: () => $('#stFile').click() }, svgIcon('<path d="M8 10V2M5 5l3-3 3 3M3 12.5h10"/>'), 'Импорт из файла'),
    ),
    el('div', { class: 'st-hint' }, 'Тема хранит всё, кроме вкладки «Звук»: скорость, кроссфейд и плавность паузы не переносятся. Формат файла: playermoon-theme, версия 1.'),
  );
  renderThemes();
}
function renderThemes() {
  const list = store.get('pm.themes', []);
  themesList.innerHTML = '';
  if (!list.length) { themesList.append(el('div', { class: 'st-empty' }, 'Пока пусто. Настройте вид и нажмите «Сохранить текущую».')); return; }
  list.forEach((t, i) => {
    const s = t.settings || {};
    const sws = el('div', { class: 'sws' });
    for (const c of [s.winColor, s.accent, s.accent2]) { const d = el('i'); d.style.background = /^#[0-9a-f]{6}$/i.test(c) ? c : '#888'; sws.append(d); }
    themesList.append(el('div', { class: 'st-theme' }, sws, el('span', {}, String(t.name)),
      el('button', { class: 'st-btn', onclick: () => { applyTheme(s); toast('Тема «' + t.name + '» применена'); } }, 'Применить'),
      el('button', { class: 'st-icon', title: 'Удалить', 'aria-label': 'Удалить', onclick: () => deleteTheme(i) }, svgIcon('<path d="M4 4l8 8M12 4l-8 8"/>'))));
  });
}
function saveTheme() {
  const name = (nameInput.value || '').trim() || 'Тема ' + (store.get('pm.themes', []).length + 1);
  const list = store.get('pm.themes', []).filter((t) => t.name !== name);
  list.push({ name, settings: themeOf(S) });
  store.set('pm.themes', list);
  nameInput.value = '';
  renderThemes();
  toast('Сохранено: ' + name);
}
function deleteTheme(i) {
  const list = store.get('pm.themes', []);
  const [t] = list.splice(i, 1);
  store.set('pm.themes', list);
  renderThemes();
  if (t) toast('Удалено: ' + t.name);
}
function exportTheme() {
  const name = (nameInput.value || '').trim() || 'моя тема';
  const data = { format: SCHEMA.format, version: SCHEMA.version, name, settings: themeOf(S) };
  const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })), download: 'playermoon-' + name.replace(/[^\p{L}\p{N}_-]+/gu, '-') + '.json' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Файл темы сохранён');
}
$('#stFile').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    if (f.size > 200000) throw new Error('size');
    const data = JSON.parse(await f.text());
    if (!data || data.format !== SCHEMA.format || typeof data.settings !== 'object') throw new Error('format');
    const clean = sanitize(data.settings);
    if (!Object.keys(clean).length) throw new Error('empty');
    const name = String(data.name || f.name).slice(0, 40);
    applyTheme(clean);
    const list = store.get('pm.themes', []).filter((t) => t.name !== name);
    list.push({ name, settings: clean });
    store.set('pm.themes', list);
    renderThemes();
    toast('Импортировано: ' + name);
  } catch {
    toast('Не удалось прочитать файл темы');
  }
});

// Случайная тема: пресет плюс случайные оси и акцент
function randomTheme() {
  const pick = (k, skip) => { const o = ITEM[k].options.filter(([v]) => v !== skip); return o[Math.floor(Math.random() * o.length)][0]; };
  const skin = SCHEMA.skins[Math.floor(Math.random() * SCHEMA.skins.length)][0];
  const h = Math.floor(Math.random() * 360);
  const hsl2hex = (hh, s, l) => { cctx.fillStyle = `hsl(${hh} ${s}% ${l}%)`; return cctx.fillStyle; };
  const motion = pick('motion', 'none');
  const ch = SCHEMA.characters[motion];
  applyTheme({
    skin, layout: pick('layout'), playlist: pick('playlist'), coverShape: pick('coverShape'), backdrop: pick('backdrop'),
    shadow: pick('shadow'), coverFx: pick('coverFx'), textFx: pick('textFx'), btnFx: pick('btnFx'), playFx: pick('playFx'),
    vizStyle: pick('vizStyle', 'off'), vizColor: pick('vizColor'), motion,
    stiffness: ch.stiffness, damping: ch.damping, speed: ch.speed,
    accent: hsl2hex(h, 85, 62), accent2: hsl2hex((h + 60 + Math.random() * 120) % 360, 85, 60),
  });
  toast('Случайная тема');
}

function toast(msg) {
  const t = $('#stToast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('on'), 1800);
}

/* =====================================================================
   ВЕРХНЯЯ ПАНЕЛЬ: быстрый выбор пресета
   ===================================================================== */
const skinSeg = $('#skinSeg'), segInd = $('.seg-ind', skinSeg);
for (const [id, name] of SCHEMA.skins) skinSeg.append(el('button', { 'data-skin': id, 'aria-pressed': 'false', onclick: () => setSetting('skin', id) }, name));
function placeSegIndicator() {
  $$('button', skinSeg).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.skin === S.skin)));
  const b = $(`button[data-skin="${S.skin}"]`, skinSeg);
  segInd.style.width = b.offsetWidth + 'px';
  segInd.style.transform = `translateX(${b.offsetLeft}px)`;
}

/* =====================================================================
   СОБЫТИЯ
   ===================================================================== */
function setRepeat() {
  state.repeat = { off: 'all', all: 'one', one: 'off' }[state.repeat];
  const b = $('.btn.repeat');
  b.classList.toggle('is-on', state.repeat !== 'off');
  b.classList.toggle('is-one', state.repeat === 'one');
  b.title = 'Повтор: ' + { off: 'выкл', all: 'все', one: 'один трек' }[state.repeat];
}

win.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  switch (t.dataset.act) {
    case 'play': setPlaying(!state.playing, true); break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'shuffle':
      state.shuffle = !state.shuffle;
      t.classList.toggle('is-on', state.shuffle);
      t.setAttribute('aria-pressed', String(state.shuffle));
      break;
    case 'repeat': setRepeat(); break;
    case 'mute': state.muted = !state.muted; if (!state.muted && state.volume === 0) state.volume = 0.5; renderVolume(); break;
    case 'playlist': setPlaylist(!state.playlistOpen); break;
    case 'mini': setMini(!state.mini); break;
    case 'settings': setSettingsOpen(!document.body.classList.contains('st-open')); break;
  }
});
$('#pageMini').addEventListener('click', () => setMini(!state.mini));
$('#pageSettings').addEventListener('click', () => setSettingsOpen(!document.body.classList.contains('st-open')));
$('#stClose').addEventListener('click', () => setSettingsOpen(false));

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.target.closest('button, input, [role="slider"], .row')) {
    e.preventDefault();
    setPlaying(!state.playing, true);
  } else if (e.key === 'Escape') {
    if (state.playlistOpen) setPlaylist(false);
    else if (document.body.classList.contains('st-open')) setSettingsOpen(false);
  }
});

// Системная настройка «меньше движения» + ручной флажок
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
const reduceChk = $('#reduceChk');
function setSysReduce(on) { state.sysReduce = on; reduceChk.checked = on; applySettings(); }
reduceChk.addEventListener('change', () => setSysReduce(reduceChk.checked));
mq.addEventListener('change', () => setSysReduce(mq.matches));
window.addEventListener('resize', () => { placeSegIndicator(); placeTabIndicator(); });

/* =====================================================================
   СТАРТ
   ===================================================================== */
buildPlaylist();
buildPanel();
buildSkinPreviews();
state.sysReduce = mq.matches;
reduceChk.checked = mq.matches;
{
  // Последнее состояние из хранилища, если есть и оно корректно
  const clean = sanitize(store.get('pm.current', null));
  loadSkin(clean.skin || 'glass', clean);
}
applySettings();
setTrack(0, 1, false);
renderVolume();
setPlaying(false);
setTab('look');
placeSegIndicator();
document.fonts && document.fonts.ready.then(() => { placeSegIndicator(); placeTabIndicator(); remeasure(); });

// Для автоматической проверки скриншотами
window.__pm = { state, get S() { return S; }, loop, setSetting, applyTheme, setPlaying, setPlaylist, setMini, setTrack, setSettingsOpen, setTab, next };
</script>
</body>
