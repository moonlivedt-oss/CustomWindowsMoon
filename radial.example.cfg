# Radial Menu: настройки и состав колец. Файл в UTF-8.
# Удобнее править через редактор (значок в трее -> Редактор колец).
#
# [@left]

[Документы]
icon = icons/projects.png
path = {documents}
expand = 1

[Картинки]
icon = icons/portfolio.png
path = {pictures}
expand = 1
files = 1

[Видео]
icon = icons/files.png
path = {videos}
expand = 1
files = 1

[@right]

[Музыка]
icon = icons/music.png
path = {music}
expand = 1

[Загрузки]
icon = icons/downloads.png
path = {downloads}
expand = 1
files = 1

[Рабочий стол]
icon = icons/desktop.png
path = {desktop}
expand = 1

[Корзина]
icon = icons/recycle.png
path = shell:RecycleBinFolder
